# Development services (Postgres for auth, Redis for the worker queues).
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stop:   docker compose -f docker-compose.dev.yml down
# Reset (deletes data): docker compose -f docker-compose.dev.yml down -v

services:
  postgres:
    image: postgres:18-alpine
    container_name: superassistant-postgres-dev
    environment:
      POSTGRES_USER: superassistant
      POSTGRES_PASSWORD: superassistant-dev
      POSTGRES_DB: superassistant
    ports:
      - "54329:5432" # host 54329 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - superassistant_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superassistant -d superassistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: superassistant-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:2026.01
    container_name: superassistant-neo4j
    environment:
      NEO4J_AUTH: neo4j/devpassword
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 | grep -q neo4j || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: superassistant-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  superassistant_postgres_dev_data:
  redis-data:
  neo4j-data:
  qdrant-data:
